name: Render FDE Course Intro

on:
  workflow_dispatch:
    inputs:
      fps:
        description: 'Frames per second'
        required: false
        default: '30'
        type: choice
        options: ['15', '30']
      duration:
        description: 'Duration in seconds'
        required: false
        default: '305'
        type: string
      quality:
        description: 'Render quality preset'
        required: false
        default: 'high'
        type: choice
        options: ['draft', 'high']
  push:
    branches: [main]
    paths:
      - '.github/workflows/render.yml'
      - 'index.html'
      - 'export-frames.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  actions: write

jobs:
  render:
    name: Render MP4 (${{ github.event.inputs.fps || '30' }}fps, ${{ github.event.inputs.quality || 'high' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FPS: ${{ github.event.inputs.fps || '30' }}
      DURATION: ${{ github.event.inputs.duration || '305' }}
      QUALITY: ${{ github.event.inputs.quality || 'high' }}
      WIDTH: 1920
      HEIGHT: 1080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /etc/apt/keyrings/google-chrome.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome-stable'

      - name: Copy local GSAP
        run: cp node_modules/gsap/dist/gsap.min.js ./gsap.min.js

      - name: Verify composition loads
        run: |
          node --input-type=commonjs -e '
            const puppeteer = require("puppeteer");
            (async () => {
              const browser = await puppeteer.launch({
                headless: "new",
                args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"],
                executablePath: process.env.PUPPETEER_EXECUTABLE_PATH || "/usr/bin/google-chrome-stable"
              });
              try {
                const page = await browser.newPage();
                const pageErrors = [];
                page.on("pageerror", err => pageErrors.push(err.message));
                page.on("console", msg => console.log("BROWSER:", msg.type(), msg.text()));

                await page.goto("file://${{ github.workspace }}/index.html", { waitUntil: "load", timeout: 120000 });

                await page.waitForFunction(() => {
                  const comp = window.__FDE_COMPOSITION__;
                  return comp && Number.isFinite(comp.duration) && typeof comp.seek === "function";
                }, { timeout: 30000 });

                const comp = await page.evaluate(() => window.__FDE_COMPOSITION__);
                if (!comp || !Number.isFinite(comp.duration) || typeof comp.seek !== "function") {
                  throw new Error("Composition controller is missing or invalid");
                }

                if (pageErrors.length) {
                  throw new Error("Browser page errors: " + pageErrors.join("; "));
                }

                console.log("Composition verified:", comp.duration, "seconds");
              } finally {
                await browser.close();
              }
            })().catch(err => {
              console.error(err);
              process.exit(1);
            });
          '
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome-stable'

      - name: Capture frames and encode MP4
        run: node export-frames.mjs
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome-stable'

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fde-course-intro-${{ github.event.inputs.fps || '30' }}fps-${{ github.event.inputs.quality || 'high' }}
          path: output/fde-course-intro.mp4
          retention-days: 7

      - name: Summary
        run: |
          echo "## Render Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **FPS**: $FPS" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Duration**: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Quality**: $QUALITY" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Resolution**: 1920x1080" >> "$GITHUB_STEP_SUMMARY"
